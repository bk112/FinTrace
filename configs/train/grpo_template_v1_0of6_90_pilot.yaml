# 模板化关系安全数据的首轮 RL trend pilot；用于确认奖励健康度，不作为长训结论。
run:
  name: qwen25_3b_fintrace_template_v1_0of6_90_pilot
  project: fintrace

model:
  base_model_path: /media/xdhpc/data/whr/models/Qwen2.5-3B-Instruct
  torch_dtype: bfloat16
  max_model_length: 4096
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.0

rollout:
  engine: transformers
  # 每个 prompt 采样四条轨迹，提供稳定的 GRPO 组内相对奖励。
  num_generations: 4
  max_response_tokens: 4096
  max_tokens_per_turn: 256
  temperature: 1.0
  top_p: 1.0
  # 模板题最多需要“定位实体 → 查询目标期 → 作答”，四轮保留冗余而不过度放大轨迹。
  max_rounds: 4
  max_tool_calls_per_round: 1
  stop_sequences:
    - "</search>"
    - "</answer>"
    - "<|im_end|>"

retrieval:
  adapter: kb
  top_k: 3
  timeout_seconds: 30

training:
  algorithm: grpo
  learning_rate: 1.0e-6
  kl_coefficient: 0.001
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 10
  epsilon: 0.2

data:
  train_path: data/processed/rl_synthesis_template_v1_0of6_100_verified.jsonl
