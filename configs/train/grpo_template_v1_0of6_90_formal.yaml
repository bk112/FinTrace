# 模板化关系安全数据的首轮正式 GRPO 训练；90 条任务约覆盖一个数据周期。
run:
  name: qwen25_3b_fintrace_template_v1_0of6_90_formal
  project: fintrace

model:
  base_model_path: /media/xdhpc/data/whr/models/Qwen2.5-3B-Instruct
  torch_dtype: bfloat16
  max_model_length: 4096
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.0

rollout:
  engine: transformers
  num_generations: 4
  max_response_tokens: 4096
  max_tokens_per_turn: 256
  temperature: 1.0
  top_p: 1.0
  max_rounds: 4
  max_tool_calls_per_round: 1
  stop_sequences:
    - "</search>"
    - "</answer>"
    - "<|im_end|>"

retrieval:
  adapter: kb
  top_k: 3
  timeout_seconds: 30

training:
  algorithm: grpo
  learning_rate: 1.0e-6
  kl_coefficient: 0.001
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 100
  # 每步记录 reward-health；每十步保存，最多保留最近三个阶段 checkpoint。
  logging_steps: 1
  save_steps: 10
  save_total_limit: 3
  epsilon: 0.2

data:
  train_path: data/processed/rl_synthesis_template_v1_0of6_100_verified.jsonl
